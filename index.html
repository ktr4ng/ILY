<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise pour mon Chéri ❤️</title>
    <meta name="description" content="Une surprise spéciale pour mon chéri d'amour.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Glow Effects -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div class="container">
        <main class="prank-container">
            <div class="surprise-card">
                <div class="heart-icon"><i class="fa-regular fa-envelope-open"></i></div>
                <h1>Pour mon Chéri... 💖</h1>
                <p class="description">J'ai préparé une surprise très spéciale et romantique pour toi !</p>
                <div class="click-instruction-box">
                    <span class="tap-hand"><i class="fa-solid fa-arrow-pointer"></i></span>
                    <p class="instruction-text">Clique n'importe où sur l'écran pour l'ouvrir !</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Logic -->
    <script src="app.js"></script>
</body>
</html>
